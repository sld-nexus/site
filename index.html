<!DOCTYPE html>
<html lang="ko" class="nexus-booting">
<head>
    <script>
        // 앱 표시 및 리소스 캐시 공통 버전
        window.APP_VERSION = "N-VAERON-V40";
        window.NEXUS_BUILD_VERSION = window.APP_VERSION;
        if (new URLSearchParams(window.location.search).get('nexusStandalone') === 'build') {
            document.documentElement.classList.add('nexus-standalone-build');
        }
        window.NEXUS_STORAGE_KEYS = {
            saveData: "nexusSaveData",
            favorites: "nexusFavorites",
            fontScale: "nexusFontScaleV2"
        };
        window.nexusAssetUrl = function(src){
            var separator = src.indexOf('?') === -1 ? '?' : '&';
            return src + separator + 'v=' + encodeURIComponent(window.APP_VERSION);
        };
        window.nexusCleanUpdateParams = function(){
            if(!window.location || !window.history || !window.history.replaceState) return;
            try{
                var url = new URL(window.location.href);
                var changed = false;
                ['fresh','__nexus_check'].forEach(function(name){
                    if(url.searchParams.has(name)){
                        url.searchParams.delete(name);
                        changed = true;
                    }
                });
                if(changed) window.history.replaceState(null, document.title || '', url.pathname + url.search + url.hash);
            }catch{}
        };
        var nexusUpdateCheckPending = false;
        window.nexusCheckIndexUpdate = function(){
            if(nexusUpdateCheckPending || !window.fetch || !window.location || window.location.protocol === 'file:') return;
            nexusUpdateCheckPending = true;
            var current = window.APP_VERSION;
            var url = new URL(window.location.href);
            url.searchParams.set('__nexus_check', String(Date.now()));
            fetch(url.href, { cache:'no-store' }).then(function(res){
                if(!res.ok) return '';
                return res.text();
            }).then(function(html){
                var match = String(html || '').match(/window\.APP_VERSION\s*=\s*["']([^"']+)["']/);
                var latest = match && match[1];
                if(!latest || latest === current) return;
                var key = 'nexus-auto-refresh:' + latest;
                try{
                    if(sessionStorage.getItem(key) === '1') return;
                    sessionStorage.setItem(key, '1');
                }catch{}
                var next = new URL(window.location.href);
                next.searchParams.set('fresh', latest);
                next.searchParams.delete('__nexus_check');
                window.location.replace(next.href);
            }).catch(function(){}).finally(function(){ nexusUpdateCheckPending = false; });
        };
        window.nexusCleanUpdateParams();
        setTimeout(window.nexusCheckIndexUpdate, 1200);
        window.addEventListener('focus', window.nexusCheckIndexUpdate);
        document.addEventListener('visibilitychange', function(){
            if(!document.hidden) window.nexusCheckIndexUpdate();
        });
        setInterval(window.nexusCheckIndexUpdate, 180000);
    </script>

    <style>
        html.nexus-booting body{margin:0;background:#000000;color:#e7c57b;overflow:hidden;}
        html.nexus-booting .global-header,html.nexus-booting .main-layout,html.nexus-booting .recipe-tooltip{visibility:hidden;}

        #nexusBootScreen .boot-card{box-sizing:border-box;width:min(360px,calc(100vw - 48px));max-height:calc(100dvh - 24px);overflow-y:auto;padding:32px;border:1px solid #51432b;border-radius:20px;background:#15161a;text-align:center;box-shadow:0 16px 60px #00000040;}

    <script>
        (function(){
            function copyTextFallback(text){
                var area=document.createElement('textarea');
                area.value=text;
                area.setAttribute('readonly','');
                area.style.position='fixed';
                area.style.left='-9999px';
                document.body.appendChild(area);
                area.select();
                try{document.execCommand('copy');}catch{}
                area.remove();
            }
            window.nexusCopyBootErrorCode=function(code, btn){
                var done=function(){ if(btn){ var old=btn.textContent; btn.textContent='복사됨'; setTimeout(function(){btn.textContent=old;},1200); } };
                if(navigator.clipboard && window.isSecureContext){
                    navigator.clipboard.writeText(code).then(done).catch(function(){ copyTextFallback(code); done(); });
                }else{
                    copyTextFallback(code); done();
                }
            };
            window.nexusShowBootError=function(code, err){
                if(window.__nexusBootError && window.NEXUS_LAST_BOOT_ERROR && window.NEXUS_LAST_BOOT_ERROR.code!==code) return;
                window.__nexusBootError=true;
                try{window.NEXUS_LAST_BOOT_ERROR={code:code,error:err||'unknown',time:Date.now()};}catch{}
                if(document.readyState==='loading' && !document.getElementById('nexusBootScreen')){
                    document.addEventListener('DOMContentLoaded',function(){window.nexusShowBootError(code,err);},{once:true});
                    return;
                }
                try{
                    var types={
                        N1001:{title:'넥서스 실행 오류',guide:'초기화 중 오류가 발생했습니다. 아래 상세 원인을 확인하세요.'},
                        N1002:{title:'스크립트 파일 로드 실패',guide:'표시된 JavaScript 파일의 경로와 배포 여부를 확인하세요.'},
                        N1003:{title:'유닛 데이터 로드 실패',guide:'data.js와 UNIT_DATABASE 선언을 확인하세요.'},
                        N1004:{title:'필수 리소스 로드 실패',guide:'표시된 CSS·이미지 파일이 정상적으로 제공되는지 확인하세요.'},
                        N1005:{title:'중복 유닛명 확인 필요',guide:'data.js에서 중복 유닛명을 수정한 뒤 새로고침하세요.'}
                    };
                    var info=types[code]||{title:'넥서스 초기화 오류',guide:'오류 정보를 확인하세요.'};
                    var reason=err && err.message ? String(err.message) : String(err || '상세 원인 정보가 없습니다.');
                    var matched=(reason + "\n" + (err && err.stack || "")).match(/([\w.-]+\.(?:js|css|png|jpe?g|webp|svg))(?:\?[^\s]*)?/i);
                    var file=err && (err.file || err.fileName) || (matched && matched[1]) || (code==='N1003' || code==='N1005'?'data.js':'');
                    var duplicates=err && Array.isArray(err.duplicates) ? err.duplicates : [];
                    document.documentElement.classList.add('nexus-booting','nexus-boot-error');
                    var boot=document.getElementById('nexusBootScreen');
                    if(boot){
                        boot.removeAttribute('aria-hidden');
                        boot.innerHTML='<div class="boot-card"><div class="boot-title" id="nexusBootTitle"></div><div class="boot-desc" id="nexusBootDesc"></div><div class="boot-error-code" id="nexusBootCode" aria-label="오류코드"></div><div class="boot-error-info"><div class="boot-error-label">상세 원인</div><div class="boot-error-reason" id="nexusBootReason"></div><div class="boot-error-file" id="nexusBootFile" hidden></div><div class="boot-duplicate-list" id="nexusBootDuplicateList" hidden></div></div><div class="boot-actions"><button class="boot-action-btn" id="nexusBootCopyBtn" type="button">오류 정보 복사</button><button class="boot-action-btn primary" id="nexusBootReloadBtn" type="button">새로고침</button></div></div>';
                        document.getElementById('nexusBootTitle').textContent=info.title;
                        document.getElementById('nexusBootDesc').textContent=info.guide;
                        document.getElementById('nexusBootCode').textContent=code;
                        document.getElementById('nexusBootReason').textContent=reason;
                        var fileElement=document.getElementById('nexusBootFile');
                        if(file){fileElement.textContent='관련 파일: '+file;fileElement.hidden=false;}
                        var list=document.getElementById('nexusBootDuplicateList');
                        if(duplicates.length){
                            list.hidden=false;
                            duplicates.forEach(function(item){
                                var row=document.createElement('div');
                                row.className='boot-duplicate-item';
                                var heading=document.createElement('div');
                                heading.textContent='유닛명: '+item.name+' (중복 '+item.positions.length+'개)';
                                var location=document.createElement('div');
                                location.className='boot-duplicate-position';
                                location.textContent='UNIT_DATABASE 데이터 순서: '+item.positions.join(', ');
                                row.appendChild(heading);
                                row.appendChild(location);
                                list.appendChild(row);
                            });
                        }
                        var copyBtn=document.getElementById('nexusBootCopyBtn');
                        var reloadBtn=document.getElementById('nexusBootReloadBtn');
                        if(copyBtn) copyBtn.onclick=function(){
                            var report=[code,info.title,reason,file?'관련 파일: '+file:''];
                            duplicates.forEach(function(item){report.push('유닛명: '+item.name+' / 중복 '+item.positions.length+'개 / UNIT_DATABASE 데이터 순서: '+item.positions.join(', '));});
                            window.nexusCopyBootErrorCode(report.filter(Boolean).join('\n'),copyBtn);
                        };
                        if(reloadBtn) reloadBtn.onclick=function(){window.location.reload();};
                    }
                }catch(e){window.NEXUS_BOOT_RENDER_ERROR=e;}
            };
            window.addEventListener('error',function(event){
                if(event.error && !window.__nexusAppReady && !window.__nexusBootError){
                    window.nexusShowBootError('N1001',event.error);
                }
            });
            window.addEventListener('error',function(event){
                var link=event.target;
                if(link && link.matches && link.matches('link[data-boot-style]')){
                    link.dataset.loadFailed='1';
                    window.nexusShowBootError('N1004',new Error((link.getAttribute('href') || 'stylesheet') + ' load failed'));
                }
            },true);
            function waitForEssentialResources(){
                function waitForDocument(){
                    if(document.readyState!=='loading') return Promise.resolve();
                    return new Promise(function(resolve){document.addEventListener('DOMContentLoaded',resolve,{once:true});});
                }
                function waitForStyle(){
                    var links=Array.from(document.querySelectorAll('link[data-boot-style]'));
                    if(links.length!==3) return Promise.reject(new Error('required stylesheet missing'));
                    return Promise.all(links.map(function(link){
                        if(link.dataset.loadFailed==='1') return Promise.reject(new Error((link.getAttribute('href') || 'stylesheet') + ' load failed'));
                        if(link.sheet) return Promise.resolve();
                        return new Promise(function(resolve,reject){
                            link.addEventListener('load',resolve,{once:true});
                            link.addEventListener('error',function(){reject(new Error((link.getAttribute('href') || 'stylesheet') + ' load failed'));},{once:true});
                        });
                    }));
                }
                function waitForPageLoad(){
                    if(document.readyState==='complete') return Promise.resolve();
                    return new Promise(function(resolve){window.addEventListener('load',resolve,{once:true});});
                }
                function waitForImages(){

                    var images=Array.from(document.images).filter(function(img){
                        return img.src && img.loading!=='lazy' && !img.closest('[hidden]');
                    });
                    return Promise.all(images.map(function(img){
                        function check(){
                            if(img.naturalWidth>0) return;
                            throw new Error('required image failed: '+(img.currentSrc || img.src));
                        }
                        if(img.complete){try{check();return Promise.resolve();}catch(error){return Promise.reject(error);}}
                        return new Promise(function(resolve,reject){
                            img.addEventListener('load',resolve,{once:true});
                            img.addEventListener('error',function(){reject(new Error('required image failed: '+(img.currentSrc || img.src)));},{once:true});
                        });
                    }));
                }
                function waitForPaint(){
                    return new Promise(function(resolve){
                        requestAnimationFrame(function(){requestAnimationFrame(resolve);});
                    });
                }
                return waitForDocument()
                    .then(waitForStyle)
                    .then(waitForPageLoad)
                    .then(function(){return document.fonts ? document.fonts.ready : null;})
                    .then(waitForImages)
                    .then(waitForPaint);
            }
            function releaseBootScreen(){
                if(window.__nexusBootError) return;
                document.documentElement.classList.remove('nexus-booting','nexus-boot-error');
                var boot=document.getElementById('nexusBootScreen');
                if(boot) boot.setAttribute('aria-hidden','true');
            }
            window.nexusMarkAppReady=function(){
                if(window.__nexusAppReady || window.__nexusBootError) return;
                window.__nexusAppReady=true;
                waitForEssentialResources().then(releaseBootScreen).catch(function(error){
                    window.nexusShowBootError('N1004',error);
                });
            };
        })();
    </script>

<script id="headerControlLabels">
(function(){
'use strict';
  function syncHeaderControlLayout(){
    var header=document.getElementById('globalHeader');
    if(!header) return;
    var rect=header.getBoundingClientRect();
    header.dataset.nexusLayout=window.innerWidth<768?'mobile':(rect.width<400 && rect.height>window.innerHeight*.7?'rail':'bar');
  }
  function mountControlLabels(){
    var definitions=[
      ['[data-nexus-view="dps"]','개복디 빌더',window.innerWidth<768?32:34],
      ['#btnFontSizePopup','글씨 크기 조절',window.innerWidth<768?32:34],
      ['#btnBuildStandalone','나의 조합 독립 창',window.innerWidth<768?32:34],
    ];
    definitions.forEach(function(definition){
      document.querySelectorAll(definition[0]).forEach(function(control){
        if(control.id==='btnBuildStandalone' && new URLSearchParams(window.location.search).get('nexusStandalone')==='build') return;
        var base=definition[2];
        control.style.setProperty('--nexus-control-base',base+'px');
        if(control.classList.contains('nexus-labelled-control')) return;
        control.classList.add('nexus-labelled-control');
        control.dataset.nexusControlName=definition[1];
        control.removeAttribute('title');
        var icon=document.createElement('span');
        icon.className='nexus-control-icon';
        icon.setAttribute('aria-hidden','true');
        while(control.firstChild) icon.appendChild(control.firstChild);
        control.appendChild(icon);
        var label=document.createElement('span');
        label.className='nexus-action-label';
        label.setAttribute('aria-hidden','true');
        var text=document.createElement('span');
        text.textContent=definition[1];
        label.appendChild(text);
        control.appendChild(label);
      });
    });
    if(window.__nexusControlLabelsBound) return;
    window.__nexusControlLabelsBound=true;
    var current=null,timer=0,touchTarget=null,armed=null,armedUntil=0;
    function findControl(target){return target && target.closest ? target.closest('.nexus-labelled-control') : null;}
    function hide(){
      clearTimeout(timer);
      if(current) current.classList.remove('is-label-visible','is-label-touch');
      current=null;armed=null;armedUntil=0;
    }
    function show(control,touch){
      if(!control || control.disabled) return;
      if(current && current!==control) hide();
      current=control;
      clearTimeout(timer);
      control.classList.add('is-label-visible');
      control.classList.toggle('is-label-touch',!!touch);
      var label=control.querySelector('.nexus-action-label');
      var width=Math.ceil(label.scrollWidth);
      var base=parseFloat(control.style.getPropertyValue('--nexus-control-base')) || 34;
      control.style.setProperty('--nexus-label-width',width+'px');
      control.style.setProperty('--nexus-control-expanded',(base+width+12)+'px');
      timer=setTimeout(hide,touch?3000:2000);
    }
    document.addEventListener('pointerover',function(event){
      if(event.pointerType==='touch' || event.pointerType==='pen') return;
      var control=findControl(event.target);
      if(control && control!==findControl(event.relatedTarget)) show(control,false);
    },true);
    document.addEventListener('pointerout',function(event){
      if(event.pointerType==='touch' || event.pointerType==='pen') return;
      if(current && findControl(event.target)===current && findControl(event.relatedTarget)!==current) hide();
    },true);
    document.addEventListener('focusin',function(event){
      var control=findControl(event.target);
      if(control && control!==touchTarget) show(control,false);
    });
    document.addEventListener('focusout',function(event){
      if(!touchTarget && current && findControl(event.relatedTarget)!==current) hide();
    });
    document.addEventListener('pointerdown',function(event){
      var control=findControl(event.target);
      var touch=event.pointerType==='touch' || event.pointerType==='pen';
      touchTarget=touch?control:null;
      if(touch && control) show(control,true);
      else if(!control) hide();
    },true);
    document.addEventListener('pointercancel',function(){touchTarget=null;hide();},true);
    document.addEventListener('click',function(event){
      var control=findControl(event.target);
      if(!control) return;
      // 마우스/키보드는 한 번 클릭, 터치는 이름 확인 후 두 번째 탭에서 실행합니다.
      if(control!==touchTarget || event.detail===0){touchTarget=null;hide();return;}
      if(armed===control && Date.now()<armedUntil){touchTarget=null;hide();return;}
      event.preventDefault();
      event.stopImmediatePropagation();
      show(control,true);
      armed=control;
      armedUntil=Date.now()+3000;
    },true);
    document.addEventListener('keydown',function(event){
      if(event.key==='Escape'){touchTarget=null;hide();}
      if(event.key==='Enter' || event.key===' '){touchTarget=null;hide();}
    },true);
    window.addEventListener('resize',function(){hide();mountControlLabels();syncHeaderControlLayout();},{passive:true});
    window.addEventListener('blur',function(){touchTarget=null;hide();});
  }

function init(){mountControlLabels();syncHeaderControlLayout();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>

<body>

<script>
        (function(){
            var files = ['data.js','config.js','hiddenboard.js','invenboard.js','responsive.js','app.js'];
            function loadNext(index){
                if(index >= files.length) return;
                var src = files[index];
                var script = document.createElement('script');
                script.src = window.nexusAssetUrl(src);
                script.async = false;
                script.onload = function(){ loadNext(index + 1); };
                script.onerror = function(){
                    if(typeof window.nexusShowBootError === 'function') window.nexusShowBootError('N1002', new Error(src + ' load failed'));
                };
                document.body.appendChild(script);
            }
            loadNext(0);
        })();
    </script>
